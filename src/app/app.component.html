<div class="app-shell min-vh-100">
  <app-overflow-nav
    [loggedIn]="isLoggedIn" [currentUrl]="currentUrl" [avatarUrl]="profileAvatarUrl"
    [isAdmin]="adminService.isAdmin"
    [requestCount]="requestNotificationService.unreadRequestCount"
    [messageCount]="messageNotificationService.unreadCount"
    [notificationCount]="notificationService.unreadCount"
    (logout)="logout()" (avatarError)="onAvatarError()">
  </app-overflow-nav>

  <main class="container py-4">
    @if (authErrorMessage) {
      <div class="alert alert-warning" role="alert">{{ authErrorMessage }}</div>
    }
    <router-outlet></router-outlet>
  </main>
</div>
